# ============================================================
#  KERONG Penguin 配置文件
#
#  快速上手：
#  - 改完配置执行 /hbkrg reload 立即生效（绝大多数配置支持，
#    无需重启服务器；reload 会顺带同步 QQ 快捷指令面板）
#  - 必须重启才生效的只有两处：bot.app-id / bot.secret、update-check
#  - 列表每一项都要加双引号，如 ["ABC123", "DEF456"]
#  - 以 # 开头的行是注释，不影响运行，可放心删改
# ============================================================

# 配置文件版本号（插件自动维护，勿改）
config-version: 64

# 启动后自动联网检查新版本（改这里需重启才生效）
update-check:
  # 检查开关（false = 不联网检查）
  enabled: true
  # mirror-url: "off"   # 官网不可达时的备用镜像（off = 关闭回退）

# 服务器显示名称（显示在图片卡片的副标题与进出服播报里；
# 留空自动使用 bot.name）
serverName: "KERONGPenguin"

# ---------------- 机器人账号（必填） ----------------
bot:
  # 机器人的 AppID 与密钥（QQ 开放平台获取，教程见官网；密钥注意保密）
  # ⚠ 改这两项后必须重启服务器
  app-id: ""
  # 密钥（QQ 开放平台获取，与 AppID 同段；⚠ 改后必须重启）
  secret: ""
  # 机器人名称（仅用于显示）
  name: "KERONGPenguin"
  # 断线重连提示开关（false = 过程提示只写日志文件不刷控制台）
  reconnect-notify: true
  # 允许响应的群列表：填「群 OpenId」不是群号，每项双引号如 ["ABC123"]
  # 留空 [] = 自动绑定：机器人拉进群后群里发任意消息自动入列表并重载；
  # 之后加别的群自行编辑本列表，或清空后让新群先发消息
  # 只写一对引号（如 [""]）视同没填——不会误判为已配置
  groups: []
  # 多服务器集群（单服无需配置）：多台服务器共用同一机器人（相同 AppID）
  # 时各服配置 name（本服显示名）与 members（全部成员名，各服一致）；
  # 配置后群里命令先弹「选择服务器」按钮，由所选服处理
  cluster:
    # 本服显示名（单服留空 = 用 serverName）
    name: ""
    # 示例（去掉行首 # 生效）：members: ["生存服", "创造服"]
    members: []
    # 查在线 / 查性能同时显示全部服务器（默认关，仅集群生效）；reload 即时生效
    show-multi-cards: false
  # QQ 按钮互动冷却秒数（同一用户两次点击按钮的最小间隔，防刷屏；
  # 0 = 关闭；与 render 段的图片命令冷却互不影响；reload 即时生效）
  button-cooldown-seconds: 5

# ---------------- 聊天转发 ----------------
chat-format:
  # 游戏消息转发到群的格式（{name} 玩家名，{message} 内容）
  from-game: "[游戏] <{name}> {message}"
  # 群消息转发到游戏的格式
  from-group: "[§bQQ§r] {name}: {message}"
  # 双向聊天转发总开关（关闭后仅命令可用）
  post-chat: true
  # 游戏内聊天转发前缀：只有 # 开头的消息才转发到群（"" = 全部转发）
  start-with: "#"
  # 群消息转发到游戏时显示的发送者名字固定为该成员的群昵称（即他在群里
  # 显示的名字：设置过群名片就是群名片，没设置就是他的 QQ 昵称），全量转发
  # 与「/发信息」命令转发同口径，不再提供配置项（历史配置键升级自动删除）

# ---------------- 进出服播报 ----------------
player-events:
  # 玩家进服 / 离服 / 死亡是否向群播报（只发给 bot.groups 里的群）
  # 文案可用：{name} 玩家名、{server} 服务器名、{platform} 平台
  join:
    # 进服播报开关
    enabled: true
    # 进服播报文案
    format: "[游戏] {name} 加入了服务器"
  # 离服播报（与进服同结构）
  quit:
    # 离服播报开关
    enabled: true
    # 离服播报文案
    format: "[游戏] {name} 离开了服务器"
  # 死亡播报（默认关闭，开启后玩家死亡向群播报）
  # 除通用占位符外还可用：{message} 死亡原因（1.7.6.4 覆盖轮起与玩家
  # 名分开，纯死因不含玩家名；插件 / 模组自定义文案开头的玩家名会自动
  # 剥掉不重复）、{killer} 击杀者名（环境死亡时为「未知」）
  death:
    # 死亡播报开关（默认关）
    enabled: false
    # 死亡播报文案（{name} 玩家名与 {message} 死亡原因分开，中间一个空格）
    format: "[游戏] {name} {message}"
    # 自定义死亡原因（默认开）：开启时其他插件 / 模组改写的死亡文案优先
    # 原样采用；关闭时只展示插件内置的原版死亡原因，其余统一显示「死了」
    custom-causes: true

# ---------------- 服务器开关消息 ----------------
# 服务器关闭 / 重启 / 意外关闭时向 QQ 群发通知（默认开；只发 bot.groups
# 里的群；上次未正常收尾的下次启动补发「意外关闭」；首次安装不发送）
server-notify:
  # 总开关，关闭后下面四项都不发送
  enabled: true
  # 重启判定窗口（秒）：上次正常关闭后在这个秒数内再次开机判定为「重启」，
  # 发 restart 重启文案；超过这个时长再开机按普通开机处理，发 start 开机文案；
  # 0 = 不判定重启，一律按普通开机播报
  restart-window: 180
  # 正常关闭时发送
  shutdown:
    # 发送开关
    enabled: true
    # 可用占位符：{server}、{platform}
    message: "[状态]\n服务器已正常关闭"
  # 判定为重启时发送
  restart:
    # 发送开关
    enabled: true
    # 上次正常关闭后在 restart-window 秒内再次开机时发送（判定为重启）
    # 可用占位符：{server}、{platform}
    message: "[状态]\n服务器重启完毕，已正常运行(o‿∩)"
  # 普通开机时发送
  start:
    # 发送开关
    enabled: true
    # 上次正常关闭后超过 restart-window 秒再开机时发送（普通开机）；首次安装不发送
    # 可用占位符：{server}、{platform}
    message: "[状态]\n服务器已开启！！(≧∇≦)/"
  # 上次未正常关闭时发送
  crash:
    # 发送开关
    enabled: true
    # 上次运行没有正常关闭（崩溃、kill -9、断电等）时，下次启动后发送
    # 可用占位符：{server}、{platform}
    message: "[状态]\n服务器...."

# ---------------- 查在线输出 ----------------
# /查在线 输出方式由下方 motd.use-markdown 控制：
#   false = 渲染图片（默认：毛玻璃卡片 + 皮肤头像）
#   true  = 文字列表（模板 Markdown/online.md，缺文件自动回退图片）
# 模板可用：{online} 在线人数、{players} 玩家列表、{server} 服务器名
markdown:
  # 查在线模板文件名（Markdown/ 目录下）
  queryOnline: "online.md"

# ---------------- 命令执行方式 ----------------
# /执行命令 等命令的执行方式（保持默认 Auto 即可）：
#   Auto = 自动检测（混合端用混合控制台，纯插件端用模拟控制台）
#   Hybrid = 强制混合控制台（仅 Mohist / CatServer 等混合端）
command-sender: "Auto"

# ---------------- 服务器状态图 ----------------
motd:
  # 服务器公网 IP 与端口（供下方 api 地址里的 {ip} {port} 替换）
  server-ip: ""
  # 公网端口（与 server-ip 配套，供状态图 api 占位符替换）
  server-port: 0
  # 服务器状态图 API（{ip} {port} 自动替换；不需要状态图可留空）
  api: "http://motd.txssb.cn/api/app_img?ip={ip}&port={port}&dark=true&lang=zh-CN"
  # 是否随消息发送状态图片
  post-img: true
  # /查在线 输出：false = 渲染图片（默认）；true = 文字列表
  use-markdown: false

# ---------------- 图片渲染 ----------------
# 玩家名片卡片、查在线、排行榜、查性能共用本段
render:
  # 同一玩家查询结果复用秒数（0 = 每次重新渲染）
  result-cache-seconds: 60
  # 头像缓存有效期（小时；换皮肤想立即更新就改小；0 = 不缓存）
  avatar-cache-hours: 3
  # 渲染停止多少分钟后自动释放图像缓存内存（0 = 不释放）
  idle-release-minutes: 15
  # 毛玻璃模糊度（0-100，越大越模糊，0 = 不模糊）
  blur-strength: 50
  # 标题框黑度（0-255，越大越深）：四张卡片顶部标题区用，比项目卡片略浅
  title-card-gray: 80
  # 项目卡片黑度（0-255，越大越深）：玩家名片统计面板与查在线 / 排行榜 / 查性能的列表容器用
  item-card-gray: 106
  # 副标题灰度（0-255，越大越深）：玩家名片玩家名称项与五张卡片的
  # 副标题条（服务器 / 更新时间 / 渲染耗时）用，默认 106 与项目卡片相同
  subtitle-card-gray: 106
  # 自定义渲染线程（高级；默认关闭 = 自动：渲染线程取 CPU 核数一半
  # 1~4 条、头像下载 8 条）；⚠ 渲染线程调大会抢占游戏 CPU（不建议
  # 超过物理核数一半）；本段修改后需重启生效
  custom-render-threads:
    # 自定义开关（false = 自动模式，忽略下面两键）
    enabled: false
    # 图片渲染线程数（1-16，调大抢占游戏 CPU，慎改）
    render-threads: 2
    # 头像批量下载线程数（1-16，调大增加头像接口压力，不影响游戏）
    avatar-threads: 8
  # 图片命令冷却秒数（同一用户两次查询的最小间隔，防刷屏；0 = 关闭）
  command-cooldown-seconds: 5
  # 各卡片是否用内置背景图（false = 用 img/ 文件夹随机图，无图自动回退）
  info-card-builtin-background: true
  # 查在线列表卡片内置背景（false = 用 img/ 随机图）
  online-list-builtin-background: true
  # 查性能卡片（固定五项：TPS / MSPT / 内存 / CPU / 在线人数）
  performance:
    # 是否用内置背景图（false = 用 img/ 随机图，无图自动回退内置）
    builtin-background: true
    # 性能数据缓存秒数（0 = 每次实时渲染）
    cache-seconds: 60
    # 在线人数卡展示值来源（人数 N 与最大 M 一起生效）：
    #   real = 真实值（默认）
    #   motd = 服务器列表展示值（其他插件 / 模组改过的；插件按需本机自
    #          查询服务器列表，60 秒内复用结果，查不到回退真实值）
    max-players-source: "real"

# ---------------- 图片下载 ----------------
# /hbkrg bpng（图片包列表 / 下载）总开关；关闭后命令只回复
# 「管理员已关闭图片下载功能」；/hbkrg bpngsz 切换背景不受影响
image-download:
  # 图片下载总开关
  enabled: true

# ---------------- 背景图说明（无需配置） ----------------
# 各卡片默认用内置背景图（随 JAR 自带，零配置即用）。
# 想用自己的图片：把 jpg / png 放进 img/ 文件夹（插件版
# plugins/KERONGPenguin/img/，模组版 kerongpenguin/img/，多张随机轮换），
# 再把对应功能的 builtin-background 开关改为 false（render 段三处、
# leaderboard 与 coins-leaderboard 各一处）。
# 没有现成图片：/hbkrg bpng 查看官网图片包，/hbkrg bpng <包ID> 自动下载
# 到 img/（显示进度，可中断，失败自动跳过）。
# 一键切换：/hbkrg bpngsz yes 全部改用 img/ 图片，no 恢复内置背景。

# ---------------- 变量获取（需 PlaceholderAPI 插件） ----------------
# 开启后下列项目优先读取你填写的变量（PlaceholderAPI 占位符）：
# 玩家名片卡片（时长 / 金币 / 点券 / 称号 / 玩家名 / 自定义项目）、
# 在线排行榜（玩家名 / 时长）、财富榜（玩家名 / 金币）、查性能（TPS）
# 变量留空 = 用插件自带数据；读取失败自动回退自带数据
variable-fetch:
  # 总开关（默认关闭）
  enabled: false
  # 总在线时长变量
  total-playtime: ""
  # 总在线时长获取源：save-data = 服务器存档（默认，读 stats 统计文件）/
  # plugin = 插件统计 / variable = 变量优先；也接受中文值：存档数据/插件统计/变量
  total-playtime-source: "save-data"
  # 今日在线时长变量
  today-playtime: ""
  # 金币变量
  coins: ""
  # 点券变量
  points: ""
  # 称号变量
  title: ""
  # 玩家名变量（只改展示名，头像 / 统计 / 排名仍按真实玩家）
  player-name: ""
  # TPS 变量
  tps: ""
  # 自定义项目（可加任意多个）：段名 = 项目ID（不展示）；
  # 项目名称 = 卡片上的名字；获取变量 = 要读的变量（读不到不展示）
  # 示例（去掉行首 # 生效）：
  # custom-items:
  #   vip:
  #     项目名称: "VIP等级"
  #     获取变量: "%vault_rank%"
  custom-items: {}

# ---------------- 排行榜 ----------------
# /在线排行榜：总在线时长排行（排名徽章 + 皮肤头像 + 玩家名 + 时长）
# /财富榜：金币排行（需 Vault，含离线玩家）
# 两个排行榜共用同一个「单页上限」配置（page-size，全局生效）
leaderboard:
  # 单页最多显示多少名（全局：在线排行榜 / 财富榜共用；
  # 超出自动分多张图片发送；1-100）
  page-size: 20
  # 显示前 N 名（1-100）
  top: 15
  # 是否用内置背景图（false = 用 img/ 随机图，无图自动回退内置）
  builtin-background: true

# /查在线 的假人列表
online-list:
  # 查在线额外显示「假人在线」小节（默认关）：开启后主列表只算真实玩家，
  # 底部列出在线假人；同口径假人不计入排行榜。reload 即时生效
  show-fake-players: false

# /财富榜的显示人数与背景（单页上限共用上方 leaderboard.page-size）
coins-leaderboard:
  # 显示前 N 名（1-100）
  top: 15
  # 是否用内置背景图（false = 用 img/ 随机图，无图自动回退内置）
  builtin-background: true

# 金币显示别名：填 "元宝" 后所有输出里的「金币」都显示为「元宝」
economy-alias: ""

# ---------------- QQ 绑定 ----------------
qq-bind:
  # 绑定总开关：开启后玩家进服必须先绑定 QQ（群里发 /绑定 <码> 或直接
  # 发纯数字验证码）；⚠ 先关闭服务器自带白名单——未绑定玩家会被白名单
  # 拦下拿不到验证码，QQ 绑定本身就是准入控制，勿与白名单叠用
  enabled: false
  # /玩家名片 命令开关
  personal-info: true
  # 未绑定玩家进服的拦截文案（& 颜色代码；{code} 绑定码 {name} 玩家名
  # {expire} 有效期分钟；支持多行列表或单行 \n 分行两种写法）
  kick-message:
    - "&c===== QQ 绑定验证 ====="
    - "&f你还未绑定 QQ，无法进入服务器"
    - ""
    - "&e你的专属绑定码: &a&l{code}"
    - "&7请在 QQ 群发送: &f{code}"
    - "&7（绑定码 {expire} 分钟内有效）"
  # 绑定码有效期（分钟）与位数（4-8）
  code-expire-minutes: 10
  # 绑定码位数（4-8）
  code-length: 5
  # 【Fabric 版】未绑定玩家的限制策略：进入服务器后限制全部互动
  # 未绑定玩家的限制超时踢出秒数（Fabric 版；Spigot/NeoForge 为登录期拦截无此阶段）
  restrict-timeout-seconds: 120
  # 假人白名单：名单里的玩家名按假人处理（大小写不敏感，不计入排行榜）；
  # 留空 = 仅自动检测（内存 / 回环连接）
  fake-player-whitelist: []
  # 每个 QQ 最多绑定多少个玩家（默认 1 = 单绑定，填 ≥1 整数）；调大后
  # 查名片类指令会先弹多玩家选择按钮；reload 即时生效
  max-players-per-qq: 1
  # 每日签到（群里发 /签到）
  checkin:
    # 签到开关（默认关）
    enabled: false
    # 签到回复前缀
    prefix: "[签到]"
    # 金币奖励（经 Vault 发放；未装 Vault 但装了 CoinsEngine 时改走它；
    # 都没装时签到照常累计天数不发放）
    # 两种写法：固定数额填数字（如 100.0，每次签到发 100）；
    # 随机区间填「最小~最大」（如 0~100，每次签到在区间内随机发放，含两端，
    # 两端都是整数时抽整数；签到回复里会带上「随机 0~100」标注）
    reward: 100.0
    # 点券奖励（经 PlayerPoints 发放；0 = 不发；发放后校验到账）
    points-reward: 0

# ---------------- 消息模板 ----------------
# 每条文本回复对应 globalconfig/Markdown/ 目录下一个 .md 模板。
# 更新机制（1.7.6.4）：不在白名单（keep-files）里的模板每次启动 / 重载
# 都会重置为插件内置最新默认；想保留自己改过的模板，把文件名加进
# keep-files 白名单（名单内的文件不更新不替换，原样保留）。
# 常用变量：{player} 玩家名 / {prefix} 签到前缀 / {reward} 签到金币 /
# {streak} 连续签到天数 / {name} 群昵称 / {openid} {group} OpenId /
# {version} 插件版本号 / {count} {list} 黑名单人数与列表 / {error} 错误信息
messages:
  # —— 通用 ——
  command-disabled: "command-disabled.md"            # 命令已被关闭
  no-admin-permission: "no-admin-permission.md"      # 无管理员权限
  query-too-frequent: "query-too-frequent.md"        # 查询太频繁
  server-busy: "server-busy.md"                      # 渲染队列繁忙
  image-send-failed: "image-send-failed.md"          # 图片发送失败
  manager-not-ready: "manager-not-ready.md"          # 数据管理器未就绪
  manager-not-ready-bind: "manager-not-ready-bind.md"      # 绑定管理器未就绪
  manager-not-ready-retry: "manager-not-ready-retry.md"    # 未就绪请稍后再试
  manager-not-ready-bind-retry: "manager-not-ready-bind-retry.md"  # 同上（绑定）
  qq-unknown: "qq-unknown.md"                        # 无法识别发送者
  # —— QQ 绑定 ——
  bind-usage: "bind-usage.md"                        # /绑定 用法提示
  bind-usage-fallback: "bind-usage-fallback.md"      # /绑定 用法（简短回退）
  bind-disabled: "bind-disabled.md"                  # QQ 绑定未开启
  bind-error: "bind-error.md"                        # 绑定处理异常（{error}）
  bind-success: "bind-success.md"                    # 绑定成功
  bind-invalid: "bind-invalid.md"                    # 绑定码无效或已过期
  bind-limit: "bind-limit.md"                        # 已达每 QQ 可绑定玩家上限（{count} {max}）
  select-player: "select-player.md"                  # 多玩家选择消息（{count} {list}）
  select-invalid: "select-invalid.md"                # 选择序号超范围（{count}）
  # —— 签到 ——
  checkin-disabled: "checkin-disabled.md"            # 签到未开启
  checkin-not-bound: "checkin-not-bound.md"          # 未绑定玩家签到（{prefix}）
  checkin-data-error: "checkin-data-error.md"        # 签到数据异常（{prefix}）
  checkin-time-error: "checkin-time-error.md"        # 获取北京时间失败（{prefix}）
  checkin-already: "checkin-already.md"              # 今日已签到（{prefix}）
  checkin-success-no-economy: "checkin-success-no-economy.md"  # 签到成功（无经济插件）
  checkin-reward-invalid: "checkin-reward-invalid.md"  # 奖励数额配置错误（{prefix}）
  checkin-success: "checkin-success.md"              # 签到成功得金币（{prefix} {player} {reward} {streak}）
  checkin-pay-error: "checkin-pay-error.md"          # 奖励未发放到账（{prefix}）
  # —— 玩家名片 ——
  info-bind-disabled: "info-bind-disabled.md"       # 玩家名片未开启
  info-closed: "info-closed.md"                      # 玩家名片被管理员关闭
  info-not-bound: "info-not-bound.md"                # 查自己但未绑定
  info-target-not-bound: "info-target-not-bound.md"  # 查他人但对方未绑定（{name}）
  info-render-failed: "info-render-failed.md"        # 信息卡片生成失败
  # —— 查在线 ——
  online-data-unavailable: "online-data-unavailable.md"  # 服务器数据暂不可用
  online-render-failed: "online-render-failed.md"   # 在线列表图片生成失败
  # —— 查性能 ——
  performance-render-failed: "performance-render-failed.md"  # 性能卡片生成失败
  # —— 在线排行榜 ——
  leaderboard-no-data: "leaderboard-no-data.md"     # 暂无在线时长数据
  leaderboard-render-failed: "leaderboard-render-failed.md"  # 排行榜图片生成失败
  # —— 金币排行榜 ——
  coins-leaderboard-no-economy: "coins-leaderboard-no-economy.md"  # 未安装 Vault
  coins-leaderboard-no-data: "coins-leaderboard-no-data.md"        # 暂无金币数据
  coins-leaderboard-render-failed: "coins-leaderboard-render-failed.md"  # 金币排行图片生成失败
  # —— 查询 OpenID / 玩家反查 ——
  openid-self: "openid-self.md"                     # 自己与群的 OpenId（{openid} {group}）
  openid-lookup: "openid-lookup.md"                 # OpenId 反查结果
  player-lookup: "player-lookup.md"                 # 玩家名反查结果（{player} {openidPart} {nickname} {players}）
  cluster-single: "cluster-single.md"               # /切换服务器 单服提示（{server}）
  cluster-list-fallback: "cluster-list-fallback.md" # /切换服务器 按钮不可用时的纯文本列表（{list}）
  # —— 发信息 ——
  forward-disabled: "forward-disabled.md"           # 聊天转发已关闭
  # —— AI 对话 ——
  ai-context-usage: "ai-context-usage.md"           # /AI管理 不带参数时的状态与按钮提示（{status}）
  ai-context-on: "ai-context-on.md"                 # AI 上下文已开启
  ai-context-off: "ai-context-off.md"               # AI 上下文已关闭
  ai-context-cleared: "ai-context-cleared.md"       # AI 上下文已清除
  ai-manage-disabled: "ai-manage-disabled.md"       # AI 功能未开启时的 /AI管理 提示
  ai-chat-empty: "ai-chat-empty.md"                 # @机器人 但没输入内容
  ai-chat-error: "ai-chat-error.md"                 # AI 对话失败（{error}）
  # —— 黑名单 ——
  blacklist-empty: "blacklist-empty.md"             # 黑名单为空
  blacklist-list: "blacklist-list.md"               # 黑名单列表（{count} {list}）
  blacklist-added-kicked: "blacklist-added-kicked.md"  # 拉黑并踢出（{name} {player}）
  blacklist-added: "blacklist-added.md"             # 拉黑（对方未绑定；{name}）
  blacklist-removed: "blacklist-removed.md"         # 移出黑名单（{name}）
  unblacklist-empty: "unblacklist-empty.md"         # 解除黑名单列表为空
  unblacklist-list: "unblacklist-list.md"           # 解除黑名单列表（{count} {list}；按钮逐条竖排）
  # —— 重新绑定 ——
  rebind-success: "rebind-success.md"               # 解绑成功并踢出（{player}）
  rebind-not-bound: "rebind-not-bound.md"           # QQ 未绑定任何账号
  # —— 菜单 ——
  menu: "menu.md"                                   # /菜单 按钮菜单的头部文案（{version}）
  # —— 命令执行 ——
  invalid-params: "invalid-params.md"               # 参数为空
  bridge-error: "bridge-error.md"                   # 游戏桥接未配置或失败
  sent-request: "sent-request.md"                   # 命令已执行无输出的回复（{command}）
  execute-failed: "execute-failed.md"               # 命令执行异常（{error}）
  full-amount-toggled: "full-amount-toggled.md"     # /全量 切换结果（{state}）
  # 模板白名单（1.7.6.4）：写在名单里的模板文件不会被插件更新或替换，
  # 保留你改过的内容原样；不在名单里的模板每次启动 / 重载都会重置为
  # 插件内置最新默认。填模板文件名（带不带 .md 都行），如：
  #   keep-files: ["menu.md", "bind-success"]
  keep-files: []

# ---------------- 消息过滤 ----------------
# 正则过滤：机器人收发的消息里命中这些正则的部分直接删除，
# 剩余内容照常转发（双向生效，命令回复同样过滤）
# 每一项都要加双引号，如 ["(?i)广告", "某敏感词"]
filter-regex: []

# ---------------- 管理员判定 ----------------
# 谁可以在 QQ 群使用管理员命令（/执行命令、/黑名单 等）：
#   qq = 群主与群管理员（推荐，无需配置）
#   config = 仅下方 openids 名单里的人
#   both = 满足任一即可
# qq/both 下管理类按钮仅群主/群管理员可点；config 模式按钮改为点击
# 填入输入栏手动发送，按名单判定（增删立即生效）
admin:
  # 管理员判定模式（qq / both / config）
  mode: qq
  # 管理员名单（填 OpenId，群里发 /查信息 获取；每项加双引号）
  openids: []
  # 快捷面板管理员联动（默认开）：qq/both 模式下自动把快捷面板里管理类
  # 指令设为仅群主/群管理员可见（与 /菜单 管理按钮同口径）；reload 生效
  panel-admin-linkage: true

# ---------------- 功能开关 ----------------
features:
  # 全量聊天转发：开启后群里所有消息（不止命令）都转进游戏（对全部
  # 配置群统一生效；管理员发 /全量 可随时切换并写回本文件；关闭时
  # 菜单与面板的全量按钮同步隐藏）
  full-amount: false

# ---------------- QQ 群命令开关 ----------------
# 关闭某条命令后群里不再响应，快捷菜单按钮与 /菜单 按钮同步消失；
# 改动后 /hbkrg reload 立即生效
commands:
  菜单: true            # /菜单 —— 指令按钮菜单（短按钮一行两个，长按钮独占一行置顶；无参命令点击即执行，带参命令点击复制进输入栏；分页展示）
  查信息: true          # /查信息 —— 查 OpenId（加玩家名可反查其绑定的 QQ）
  玩家名片: true        # /玩家名片 —— 玩家统计卡片（@某人 查别人）
  绑定: true            # /绑定 <绑定码> —— 绑定 QQ（纯数字码直接发送亦可）
  重新绑定: true        # /重新绑定 —— 解绑换号
  查在线: true          # /查在线 —— 在线玩家列表（别名 /在线）
  查性能: true          # /查性能 —— 性能卡片（TPS/MSPT/内存/CPU/在线人数）
  在线排行榜: true      # /在线排行榜 —— 总在线时长排行
  财富榜: true          # /财富榜 —— 金币排行（需 Vault）
  发信息: true          # /发信息 <内容> —— 发消息到游戏内
  执行命令: true        # /执行命令 <命令> —— 管理员执行服务器命令
  执行: true            # /执行 <key> —— 执行自定义命令
  管理员执行: true      # /管理员执行 <key> —— 执行管理员限定命令
  全量: true            # /全量 —— 切换全量转发总开关（管理员；对全部配置群生效并写回配置文件）
  AI管理: true          # /AI管理 开|关|清除 —— AI 上下文管理（管理员；点击按钮即可操作；AI 关闭时不可用）
  黑名单: true          # /黑名单 @QQ —— 拉黑（自动解绑并踢出，管理员）；不带 @ 列出清单并附「解除」按钮
  解除黑名单: true      # /解除黑名单 @QQ —— 解除拉黑（管理员）；不带 @ 列出清单，可点击按钮逐条解除
  签到: true            # /签到 —— 每日签到领奖励
  切换服务器: true      # /切换服务器 [服务器名] —— 多服务器集群：查看并切换当前群操作的服务器（带名直接切换；「全局」需管理员；未配置集群时提示单服）

# ---------------- AI 对话 ----------------
# QQ 群里 @机器人 或游戏内输入前缀即可对话（OpenAI / DeepSeek 等兼容接口）
ai:
  # AI 对话总开关（关闭后群内与游戏内的 AI 对话都不可用）
  enabled: false
  # 游戏内 AI 开关（玩家输入前缀触发；需总开关同时开启）
  server-enabled: false
  # 游戏内呼出前缀（玩家输入 "ai 你好" 即触发）
  server-prefix: "ai"
  # AI 回复显示前缀（游戏内 / 群内）
  server-output-prefix: "[AI]"
  # QQ 群里回复的前缀
  qq-output-prefix: "[AI]"
  # 接口地址（DeepSeek：https://api.deepseek.com；OpenAI 记得加 /v1）
  base-url: "https://api.deepseek.com"
  # API Key（服务商后台生成，注意保密）
  api-key: ""
  # 模型名称（DeepSeek 填 deepseek-chat；OpenAI 填 gpt-4o-mini 等）
  model: "deepseek-chat"
  # 自动补接口地址后缀（部分接口需要补 /v1，保持默认即可）
  url-auto-append: true
  # 记住最近几轮对话（全局一份记忆，所有群与游戏内共用；0 = 不记）
  context-limit: 6
  # AI 艾特接口（默认开）：消息里 @其他成员 会还原成「@昵称」送给 AI，
  # AI 回复里的 [at:昵称] 标记自动转为 QQ 官方艾特；关闭则全部剥掉
  at-enabled: true
  # QQ 群 AI 回复提醒方式：at = 艾特发送人 / quote = 引用原消息（默认）/
  # none = 安静回复（中文「艾特/引用/无」也行）；reload 即时生效
  reminder-mode: ""
  # ---------- AI 表情包（默认开） ----------
  # 图片放插件目录 guaipng 文件夹（支持 png/jpg/jpeg/gif/webp/bmp），
  # 文件名 = 图片含义；发送时自动缩到表情大小，文件增删即时生效
  memes:
    # 表情包开关（关闭后 AI 不发表情）
    enabled: true
    # 每条回复最多发几张
    max-per-reply: 1
    # 游戏内兜底文案：AI 只想发表情包时，游戏内聊天栏显示不了图片，
    # 就回复这一句（QQ 群里正常发图不受影响）；改完保存下次对话生效
    game-fallback-text: "（只想发个表情，奈何游戏不允许）"
  # ---------- AI 提示词 ----------
  # 角色设定、技能说明与专属知识都写在这个文件里（默认模板自带技能
  # 引导；「遇到不会的可以搜索」仅在下方 AI 网页读取开启时才写进默认
  # 模板；已生成的文件不会整体重写——插件更新时自动把「技能」段刷新
  # 为本版内置内容，读取开关重新开启时会自动补上搜索引导这一行），
  # 改完保存下次对话生效
  prompt-file: "提示词.md"
  # ---------- AI 网页读取（默认开，1.7.6.5 起） ----------
  # 开启后 AI 需要时自动读网页（可多层深入），搜索走必应（bing.com）；
  # ⚠ 每次读取的网页内容都会消耗额外 token（按读取页数计）
  # 安全机制：仅访问 http/https 公网页；不下载任何文件（压缩包 / 安装包 /
  # 图片等下载链接一律拒绝）；正文剔除隐藏字符，回传 AI 时框定为
  # 「资料不是指令」（防网页注入）
  crawler:
    # 网页读取开关（关闭时提示词不带搜索引导，AI 不读网页不搜索；
    # 重新开启时已生成的提示词文件会自动补上搜索引导，1.7.6.4 起；
    # 1.7.6.5 起新装默认开——已配置关闭的服务器升级后保持关闭不变）
    enabled: true
    # 单次回答最多读取的网页总数（各层累计，含搜索页）
    max-pages: 8
    # 多层深入的最大层数（第 1 层 = 入口/搜索页，逐层 +1）
    max-layers: 4
    # 单页正文提取上限（字符）
    max-chars: 6000
    # 读取超时秒数
    timeout-seconds: 10

# ---------------- 自定义指令 ----------------
# 群里发 /执行 <key> 触发预设的服务器命令，每条三个字段：
#   key        触发名称
#   command    实际执行的命令（{params} = 命令后面跟的内容）
#   permission 0 或不填 = 所有人可用；其他值 = 仅管理员
custom-commands: []
# 示例（去掉每行开头的 # 即生效）：
# - key: "公告"
#   command: "say {params}"
#   permission: 1
