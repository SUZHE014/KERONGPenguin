# ============================================================
#  KERONG Penguin 配置文件
#
#  使用说明：
#  - 修改本文件后需重启服务器生效（或在游戏内由 OP 执行
#    /huhobot reload，可简写 /hb reload）
#  - 列表项（如 bot.groups、filter-regex、admin.openids）填写时，
#    每一项都必须加双引号，例如 ["ABC123", "DEF456"]
#  - 含中文或特殊符号的值建议用引号包裹（如 "KERONGPenguin"），避免解析问题
#  - 以 # 开头的行是注释，不影响插件运行，可以放心删改
# ============================================================

# 配置文件版本号（插件自动维护，请勿手动修改；
# 升级插件时会自动补齐新增的配置项、清理已废弃的配置项）
config-version: 16

# 服务器显示名称：用于进出服播报的 {server} 变量、统计卡片、
# 查在线、在线排行榜等展示场景
# 留空时会自动使用下方 bot.name 的值
serverName: "KERONGPenguin"

# ---------------- 机器人账号（必填） ----------------
bot:
  # 机器人 ID：QQ 开放平台"机器人管理"页面的 AppID（一串数字）
  # 获取教程见官网"安装教程"第 1 步
  app-id: ""
  # 机器人密钥：同页面的 AppSecret（注意保密，泄露请立即在平台重置）
  secret: ""
  # 机器人名称：仅用于显示（serverName 留空时作为后备显示名），
  # 可与 QQ 内实际昵称不同
  name: "KERONGPenguin"
  # 允许机器人响应的 QQ 群列表（填"群 OpenId"，不是群号码！）
  # 获取方式：把机器人拉进群 → 在群里发送 /查询open ID → 机器人回复的"群的OpenId"就是
  # 注意：填写时每一项都必须加双引号！
  # 示例：groups: ["ABC123456XYZ", "DEF789XYZ"]
  # 留空 [] 表示不限制：任何群里发命令都会响应；
  # 但聊天转发、进出服播报等主动消息只会发送给列表里的群，
  # 留空时这些消息一条都不会发（没有目标群），建议至少填上你自己的群
  groups: []

# ---------------- 聊天转发格式 ----------------
chat-format:
  # 游戏内消息转发到 QQ 群时的格式
  # 可用变量：{name} = 玩家名，{message} / {msg} = 玩家在游戏里说的话
  from-game: "[游戏] {message}"
  # QQ 群消息转发到游戏内时的格式
  # 可用变量：{name} / {nick} = 发送者 QQ 昵称，{message} / {msg} = 消息内容
  from-group: "[QQ] {name}: {message}"
  # 是否开启 QQ 群 ↔ 游戏 双向聊天转发
  # 关闭后仅命令可用，群里聊天不会转发进游戏
  post-chat: true
  # 游戏内聊天转发前缀：只有以该字符开头的聊天才会转发到 QQ 群，
  # 转发时自动去掉该前缀
  #（例如玩家发 "#今天开服" → 群里收到 "今天开服"）
  # 留空 "" 表示游戏内所有聊天都转发
  start-with: "#"

# ---------------- 玩家进出服播报 ----------------
player-events:
  # 玩家进入服务器时是否向 QQ 群播报（只播报给 bot.groups 列表里的群）
  join:
    enabled: true
    # 播报文案，可用变量：{name} / {player} = 玩家名，
    # {server} = 服务器显示名，{platform} = 运行平台（spigot/neoforge）
    format: "[游戏] {name} 加入了服务器"
  # 玩家离开服务器时是否向 QQ 群播报
  quit:
    enabled: true
    format: "[游戏] {name} 离开了服务器"

# ---------------- 查在线 Markdown 模板 ----------------
# /查在线 命令的输出方式由下方 motd.use-markdown 控制：
#   true  = 使用 Markdown 模板输出（模板文件在首次启动时自动释放到
#           plugins/KERONGPenguin/Markdown/ 目录，可直接编辑）
#   false = 自动渲染毛玻璃风格图片输出（含真实皮肤头像，人数多自动切长图，无需配置）
# 模板可用占位符：{online} 在线人数、{players} 玩家列表、
# {server} 服务器名、{img_url} 状态图片地址
#（也支持 {{.online_num}} 等 Go 风格写法；注意 {ip} {port} 只能在
# 下方 motd.api 地址里替换，不能用在模板里）
markdown:
  # 查在线模板文件名（位于 plugins/KERONGPenguin/Markdown/ 目录下）
  queryOnline: "online.md"

# ---------------- 命令执行器 ----------------
# 机器人代替管理员在服务器后台执行命令的方式（/执行命令、自定义命令等场景）：
#   Auto    = 自动检测（推荐：Mohist/CatServer/Arclight 等混合端用混合控制台，
#              纯 Spigot/Paper 用模拟控制台）
#   Hybrid  = 强制混合控制台（仅混合端服务器使用）
#   其他值  = 模拟控制台（纯插件端服务器使用）
command-sender: "Auto"

# ---------------- 服务器状态与查在线 ----------------
motd:
  # 你的服务器公网 IP（用于下方 api 地址里的 {ip} 变量替换；留空则不替换）
  server-ip: ""
  # 你的服务器端口（用于 api 地址里的 {port} 变量替换）
  server-port: 0
  # 服务器状态图片 API 地址：/motd 命令与查在线输出的服务器状态图
  # 地址里的 {ip} {port} 会自动替换为上面填写的值；不需要状态图片可留空
  api: "http://motd.txssb.cn/api/app_img?ip={ip}&port={port}&dark=true&lang=zh-CN"
  # 是否随消息发送 api 生成的服务器状态图片
  post-img: true
  # /查在线 输出方式（1.5.1 起）：
  #   true  = Markdown 模板输出（简洁文字列表，模板见 Markdown/online.md；
  #           模板文件缺失时也会自动改用图片输出）
  #   false = 渲染图片输出（毛玻璃卡片 + 真实皮肤头像；人数多时自动加长为长图
  #           一图展示全部；背景见下方"卡片背景图"说明）
  use-markdown: true

# ---------------- 卡片背景图（无需配置，仅说明） ----------------
# 查信息卡片、查在线图片、在线排行榜默认全部使用内置背景图
# （深灰色主体 + 深绿色装饰，随插件 / 模组 JAR 自带，零配置即用）。
# 想改用自己的图片：把图片（jpg/png，建议横图）放进
# plugins/KERONGPenguin/img/ 文件夹（模组版为 kerongpenguin/img/），
# 然后把对应功能的开关改为 false：
#   - 查信息：qq-bind.render.info-card-builtin-background
#   - 查在线：qq-bind.render.online-list-builtin-background
#   - 排行榜：qq-bind.leaderboard.builtin-background
# 多张图时每次渲染随机挑选一张轮换展示；任意尺寸均可
# （自动裁剪/缩放铺满；超大图自动降采样解码，手机原图直放不怕内存溢出）；
# img 文件夹里没有图片时自动回退使用内置背景图

# ---------------- QQ 绑定 ----------------
qq-bind:
  # QQ 绑定总开关：开启后玩家进服必须先绑定 QQ
  # （未绑定的玩家会被拦在进入界面，并展示专属绑定码，在群里发送 /绑定 <绑定码> 完成）
  enabled: false
  # /查信息 统计卡片命令开关（1.5.2 前该命令叫 /个人信息）
  # 关闭后群里无法查询统计卡片，快捷菜单按钮同步隐藏；
  # qq-bind.enabled 总开关关闭时本命令一并失效
  personal-info: true
  # 统计卡片渲染设置
  render:
    # 渲染完成后是否向 JVM 发 GC（垃圾回收）提示，加快释放渲染临时内存
    # 已做节流（两次至少间隔 60 秒），不会造成频繁停顿；一般保持默认 true
    gc-after-render: true
    # 同一玩家渲染结果复用秒数：期间重复查询直接发送上次图片（零渲染开销秒回）
    # 默认 60；0 = 关闭复用（每次都重新渲染）；上限 600
    result-cache-seconds: 60
    # 查信息卡片是否使用内置背景图（1.5.7 新增，默认 true）
    # true = 内置深灰底图（随 JAR 自带，零配置即用）；
    # false = 随机取数据目录 img/ 文件夹图片（多张轮换）；
    # img 里没有图片时自动回退内置背景图
    info-card-builtin-background: true
    # 查在线图片是否使用内置背景图（1.5.7 新增，默认 true）
    # 语义同上，与查信息卡片共用横版内置底图
    online-list-builtin-background: true
  # 未绑定玩家进入服务器时看到的拦截界面文案（支持 & 颜色代码，可增删行）
  # 可用变量：{code} = 专属绑定码，{name} = 玩家名，{expire} = 绑定码有效期（分钟）
  kick-message:
    - "&c===== QQ 绑定验证 ====="
    - "&f你还未绑定 QQ，无法进入服务器。"
    - ""
    - "&e你的专属绑定码: &a&l{code}"
    - "&7请在 QQ 群发送: &f/绑定 {code}"
    - "&7（绑定码 {expire} 分钟内有效）"
  # 绑定码有效期（分钟）：玩家进服弹出的绑定码超过该时间未使用即作废
  #（至少 1 分钟，填小于 1 的值按 10 处理）
  code-expire-minutes: 10
  # 绑定码位数（范围 4-8，超出范围自动按 4 或 8 处理）
  code-length: 5
  # 群内签到功能（金币经 Vault 经济插件发放；未安装经济插件时签到
  # 照常累计天数、不发放金币，装好后自动恢复发放，无需改配置）
  checkin:
    # 是否开启每日签到（群内发送 /签到 领取金币）
    enabled: false
    # 签到成功回复的前缀文案
    prefix: "[签到]"
    # 每日签到奖励的金币数量（通过 Vault 存入玩家账户）
    reward: 100.0
  # 在线排行榜（1.5.5 新增：群内发送 /在线排行榜 渲染总在线时长排行图片，
  # 每名玩家一行：排名徽章 + 皮肤头像 + 玩家名 + 总在线时长；
  # 背景默认使用内置专属底图（深灰色主体 + 深绿色装饰，随插件/模组 JAR 自带，
  # 无需放任何图片素材，零配置即用）；单张图片最多展示 15 名玩家，超出自动
  # 分段发送多张（第一张带标题，后续只画内容）；命令开关见 commands.在线排行榜）
  leaderboard:
    # 排行榜显示玩家数（默认前 15 名，单张图片最多 15 人；
    # 范围 1-100，超出自动按边界值处理；设更大值会分段发送多张图片）
    top: 15
    # 是否使用内置背景图（1.5.7 改名自 random-background，默认 true）：
    # false 时排行榜背景改为随机取数据目录 img 文件夹里的图片
    # （支持 png/jpg/jpeg/bmp/gif，与查信息、查在线卡片共用素材与缓存）；
    # img 里没有图片时自动回退内置背景图
    builtin-background: true

# ---------------- 消息过滤 ----------------
# 正则表达式过滤列表：机器人收发的消息里命中这些正则的部分会被直接删除，
# 剩余内容照常转发（QQ 群 → 游戏、游戏 → QQ 群双向生效，
# 机器人发出的命令回复同样过滤）
# 注意：填写时每一项都必须加双引号
# 示例：filter-regex: ["(?i)广告", "某敏感词"]
filter-regex: []

# ---------------- 管理员判定 ----------------
# 谁可以在 QQ 群使用管理员命令（/执行命令、/黑名单 等）：
#   qq    = 仅群主与 QQ 群管理员（推荐，无需配置）
#   config = 仅下方 openids 名单里的人
#   both  = 满足任一条件即可
admin:
  mode: qq
  # 管理员名单（mode 为 config 或 both 时生效）
  # 填 QQ 的 OpenId（不是 QQ 号！发送 /查询open ID 可获取自己的 OpenId）
  # 注意：填写时每一项都必须加双引号，如 ["OpenId1", "OpenId2"]
  openids: []

# ---------------- 功能开关 ----------------
features:
  # 全量聊天转发：开启后 QQ 群的所有消息（不止命令）都会转发进游戏
  # 也可由管理员在群内发送 /全量 随时切换（按群独立记忆，重启不丢）
  full-amount: false

# ---------------- QQ 群命令开关 ----------------
# 关闭某条命令后，群里发送该命令不再响应，快捷菜单按钮与 /帮助 里的条目同步消失
commands:
  帮助: true            # /帮助 —— 查看所有命令
  查询open ID: true     # /查询open ID —— 查询你的 OpenId 与群 OpenId（配置 bot.groups 用，1.5.2 前为 /查信息）
  查信息: true          # /查信息 —— 查询玩家统计卡片（可直接查自己；@某人 查被提及成员，1.5.2 前为 /个人信息）
  绑定: true            # /绑定 <绑定码> —— 绑定 QQ（玩家自助）
  重新绑定: true        # /重新绑定 —— 解除当前 QQ 绑定并踢出对应玩家（换号重绑用）
  查在线: true          # /查在线 —— 查询在线玩家列表
  在线排行榜: true      # /在线排行榜 —— 总在线时长排行（关闭后快捷菜单按钮同步消失，1.5.5 新增）
  在线服务器: true      # /在线服务器 —— 查看服务器 IP 与端口
  发信息: true          # /发信息 <内容> —— 发送消息到游戏内
  执行命令: true        # /执行命令 <命令> —— 管理员执行服务器命令
  执行: true            # /执行 <key> —— 执行自定义命令（所有人可用项）
  管理员执行: true      # /管理员执行 <key> —— 管理员执行自定义命令（管理员限定项）
  全量: true            # /全量 —— 切换全量聊天转发（管理员）
  motd: true            # /motd —— 查询服务器状态
  AI对话上下文: true    # /AI对话上下文 开|关 —— 切换 AI 对话记忆（管理员）
  清除当前上下文: true  # /清除当前上下文 —— 清空 AI 对话历史（管理员）
  黑名单: true          # /黑名单 @QQ —— 加入黑名单（自动解绑并踢出，管理员）
  解除黑名单: true      # /解除黑名单 @QQ —— 移出黑名单（管理员）
  签到: true            # /签到 —— 每日签到领金币

# ---------------- AI 对话 ----------------
# QQ 群内 @机器人 或游戏内输入前缀即可与 AI 对话（OpenAI / DeepSeek 等兼容接口）
ai:
  # AI 对话总开关：关闭后 QQ 群（@机器人）和游戏内的 AI 对话都不可用
  enabled: false
  # 游戏内 AI 对话开关（玩家输入前缀触发，默认关闭；
  # 需要 ai.enabled 总开关同时开启才生效）
  server-enabled: false
  # 游戏内呼出 AI 的前缀：玩家输入 "ai 你好" 即触发对话
  server-prefix: "ai"
  # AI 回复在游戏内显示时的前缀
  server-output-prefix: "[AI]"
  # AI 回复在 QQ 群内显示时的前缀
  qq-output-prefix: "[AI]"
  # AI 接口地址（OpenAI 兼容接口均可）：
  #   DeepSeek 官方：https://api.deepseek.com （不用加 /v1）
  #   OpenAI 官方：https://api.openai.com/v1
  #   其他中转/自建接口按服务商文档填写
  base-url: "https://api.deepseek.com"
  # AI 平台的 API Key（在服务商后台生成，注意保密）
  api-key: ""
  # 模型名称（DeepSeek 填 deepseek-chat；OpenAI 填 gpt-4o-mini 等）
  model: "deepseek-chat"
  # AI 的角色设定（系统提示词）：决定 AI 回复的风格与身份
  system-prompt: "你是一个友好的游戏群助手，请简洁回答。"
  # 是否自动补充接口地址后缀（部分接口需要在地址后补 /v1 才能用，保持默认即可）
  url-auto-append: true
  # AI 对话上下文保留轮数：开启 /AI对话上下文 后 AI 会记住最近几轮对话
  # （全局一份记忆：所有群、所有人与游戏内共用；0 = 不保留上下文）
  context-limit: 6

# ---------------- 自定义执行指令 ----------------
# 在 QQ 群通过 /执行 <key> 或 /管理员执行 <key> 触发预设的服务器命令
# 每条包含三个字段：
#   key        触发名称（群里发送 /执行 <key>）
#   command    实际执行的服务器命令，{params} = 触发后空一格输入的内容
#              （如 "/执行 公告 明天维护" 中 {params} = "明天维护"）
#   permission 权限：0 或不填 = 所有人可用（群里 /执行 触发）；
#              其他值（如 1）= 仅管理员可用（群里 /管理员执行 触发）
custom-commands: []
# 示例（去掉每行开头的 # 即生效）：
# - key: "公告"
#   command: "say {params}"
#   permission: 1
