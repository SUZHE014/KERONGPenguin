# ============================================================
#  KERONG Penguin 配置文件
#
#  使用说明：
#  - 修改本文件后需重启服务器生效
#  - 列表项（如 bot.groups、filter-regex、admin.openids）填写时，
#    每一项都必须加双引号，例如 ["ABC123", "DEF456"]
#  - 含中文或特殊符号的值建议用引号包裹（如 "KERONGPenguin"），避免解析问题
#  - 以 # 开头的行是注释，不影响插件运行，可以放心删改
# ============================================================

# 配置文件版本号（插件自动维护，请勿手动修改；
# 升级插件时会自动补齐新增的配置项、清理已废弃的配置项）
config-version: 22

# 插件启动后自动访问官网版本文件，检查是否有新版本
# 关闭 false = 完全不联网检查
update-check:
  enabled: true

# 服务器显示名称：用于进出服播报的 {server} 变量、统计卡片、
# 查在线、在线排行榜、金币排行榜等展示场景
# 留空时会自动使用下方 bot.name 的值
serverName: "KERONGPenguin"

# ---------------- 机器人账号（必填） ----------------
bot:
  # 机器人 ID：QQ 开放平台"机器人管理"页面的 AppID（一串数字）
  # 获取教程见官网"安装教程"第 1 步
  app-id: ""
  # 机器人密钥：同页面的 AppSecret（注意保密，泄露请立即在平台重置）
  secret: ""
  # 机器人名称：仅用于显示（serverName 留空时作为后备显示名），
  # 可与 QQ 内实际昵称不同
  name: "KERONGPenguin"
  # 断线重连过程提示开关（1.6.2 新增，默认 true；1.6.6.3 起默认防刷屏）
  # 机器人断开后 SDK 自动重连时，控制台输出重试里程碑（本轮第 1 次 /
  # 最后一次 / 重连成功 / 重连超时），中间几次的过程提示只写插件日志文件
  # （重连风暴不再刷屏，完整过程见 logs/qq/qq-bind-日期.log）；
  # 连续 5 次失败后提示重连超时并暂停自动重连（可用 /kerong chs 立即重试，
  # 或等 30 分钟后自动进行下一轮，最多 3 轮）。
  # 关闭 false = 连「第 1 次 / 最后一次」过程提示也不输出；
  # 但「重连成功」与「重连超时 + 可用 /kerong chs 恢复」的提示不受此开关影响，始终输出
  reconnect-notify: true
  # 允许机器人响应的 QQ 群列表（填"群 OpenId"，不是群号码！）
  # 获取方式：把机器人拉进群 → 在群里发送 /查询open ID → 机器人回复的"群的OpenId"就是
  # 注意：填写时每一项都必须加双引号！
  # 示例：groups: ["ABC123456XYZ", "DEF789XYZ"]
  groups: []

# ---------------- 聊天转发格式 ----------------
chat-format:
  # 游戏内消息转发到 QQ 群时的格式
  # 可用变量：{name} = 玩家名，{message} / {msg} = 玩家在游戏里说的话
  # 默认带 <玩家名> 前缀（如 [游戏] <Steve> 你好），群友一眼看出是谁说的
  from-game: "[游戏] <{name}> {message}"
  # QQ 群消息转发到游戏内时的格式
  # 可用变量：{name} / {nick} = 发送者 QQ 昵称，{message} / {msg} = 消息内容
  # 1.6.7.2 新默认：仅染 QQ 字样（§b 青色，§r 重置后再接玩家名）
  from-group: "[§bQQ§r] {name}: {message}"
  # 是否开启 QQ 群 ↔ 游戏 双向聊天转发
  # 关闭后仅命令可用，群里聊天不会转发进游戏
  post-chat: true
  # 游戏内聊天转发前缀：只有以该字符开头的聊天才会转发到 QQ 群，
  # 转发时自动去掉该前缀
  #（例如玩家发 "#今天开服" → 群里收到 "今天开服"）
  # 留空 "" 表示游戏内所有聊天都转发
  start-with: "#"

# ---------------- 玩家进出服播报 ----------------
player-events:
  # 玩家进入服务器时是否向 QQ 群播报（只播报给 bot.groups 列表里的群）
  join:
    enabled: true
    # 播报文案，可用变量：{name} / {player} = 玩家名，
    # {server} = 服务器显示名，{platform} = 运行平台（spigot/neoforge）
    format: "[游戏] {name} 加入了服务器"
  # 玩家离开服务器时是否向 QQ 群播报
  quit:
    enabled: true
    format: "[游戏] {name} 离开了服务器"

# ---------------- 查在线 Markdown 模板 ----------------
# /查在线 命令的输出方式由下方 motd.use-markdown 控制：
#   true  = 使用 Markdown 模板输出（模板文件在首次启动时自动释放到
#           plugins/KERONGPenguin/Markdown/ 目录，可直接编辑）
#   false = 自动渲染毛玻璃风格图片输出（含真实皮肤头像，人数多自动切长图，无需配置）
# 模板可用占位符：{online} 在线人数、{players} 玩家列表、
# {server} 服务器名、{img_url} 状态图片地址
#（也支持 {{.online_num}} 等 Go 风格写法；注意 {ip} {port} 只能在
# 下方 motd.api 地址里替换，不能用在模板里）
markdown:
  # 查在线模板文件名（位于 plugins/KERONGPenguin/Markdown/ 目录下）
  queryOnline: "online.md"

# ---------------- 命令执行器 ----------------
# 机器人代替管理员在服务器后台执行命令的方式（/执行命令、自定义命令等场景）：
#   Auto    = 自动检测（推荐：Mohist/CatServer/Arclight 等混合端用混合控制台，
#              纯 Spigot/Paper 用模拟控制台）
#   Hybrid  = 强制混合控制台（仅混合端服务器使用）
#   其他值  = 模拟控制台（纯插件端服务器使用）
command-sender: "Auto"

# ---------------- 服务器状态与查在线 ----------------
motd:
  # 你的服务器公网 IP（用于下方 api 地址里的 {ip} 变量替换；留空则不替换）
  server-ip: ""
  # 你的服务器端口（用于 api 地址里的 {port} 变量替换）
  server-port: 0
  # 服务器状态图片 API 地址：/motd 命令与查在线输出的服务器状态图
  # 地址里的 {ip} {port} 会自动替换为上面填写的值；不需要状态图片可留空
  api: "http://motd.txssb.cn/api/app_img?ip={ip}&port={port}&dark=true&lang=zh-CN"
  # 是否随消息发送 api 生成的服务器状态图片
  post-img: true
  # /查在线 输出方式（1.6.7 起默认 false = 渲染图片输出）：
  #   false = 渲染图片输出（默认：毛玻璃卡片 + 真实皮肤头像；人数多时自动加长为长图
  #           一图展示全部；背景见下方"卡片背景图"说明）
  #   true  = Markdown 模板输出（简洁文字列表，模板见 Markdown/online.md；
  #           模板文件缺失时也会自动改用图片输出）
  # 旧版升级后已保存的配置不受影响（想改回文字列表改成 true 即可）
  use-markdown: false

# ---------------- 图片渲染设置 ----------------
# 查信息卡片、查在线图片、排行榜共用本段（这些功能不依赖 QQ 绑定）
render:
  # 同一玩家渲染结果复用秒数：期间重复查询直接发送上次图片（零渲染开销秒回）
  # 默认 60；0 = 关闭复用（每次都重新渲染）；上限 600
  result-cache-seconds: 60
  # 头像磁盘缓存有效期（小时，1.6.6.1 新增）：
  # 皮肤头像会保存到数据目录 cache/avatars/ 文件夹（重启后不重复请求
  # 外部接口，卡片 / 在线列表 / 排行榜共用），超过有效期自动删除
  # （后台每 30 分钟清扫一次，查询命中到过期文件时也会顺手删；
  # 服务器启动 10 秒内也会清扫一轮，强制关机后残留的过期文件
  # 下次启动即可被清掉）；1.6.6.2 起单张超过 10KB 的大头像只走
  # 磁盘缓存不占内存，小头像才会回填内存缓存；
  # 默认 3；支持小数（如 0.5 = 半小时）；0 = 关闭磁盘缓存（每次实时获取）；
  # 改动后 /kerong reload 立即生效，无需重启
  avatar-cache-hours: 3
  # 头像获取优先方式（1.6.6.1 新增）：
  #   local    = 优先本地：直接用服务器已有的玩家皮肤数据（在线玩家档案
  #              + 本服存档），取不到时自动切换外置接口
  #   external = 优先外置接口：Mojang 官方 API → MC-Heads / Minotar /
  #              MinePic / Crafatar 多线路，全部失败后再尝试本地；
  # 默认 local；改动后 /kerong reload 立即生效，无需重启；
  # 1.6.6.2 起每次获取的实际方式（本地贴图 / Mojang 官方 / 各外置线路 /
  # 磁盘缓存）会写进插件日志文件（logs/qq/qq-bind-日期.log，不进控制台；
  # 1.6.6.2 覆盖版起同一玩家首次获取与更换线路时才记录，不再逐次刷屏），
  # 方便排查某个玩家的头像走的哪条链路
  avatar-fetch-priority: local
  # 渲染空闲内存释放（1.6.6.2 新增；1.6.7.2 默认 5 → 15）：
  # 一次渲染完成后的指定分钟内没有下一次渲染时，自动释放头像 / 背景
  # 等图像素材缓存占用的内存（释放动作会写进插件日志文件，不刷控制台；
  # 磁盘头像缓存不受影响，下次渲染自动从磁盘 / 图片文件恢复，毫秒级）；
  # 默认 15；支持小数（如 2.5 = 2 分半）；0 = 关闭空闲释放；
  # 改动后 /kerong reload 立即生效，无需重启
  idle-release-minutes: 15
  # 全局透明度（1.6.7.2 覆盖版新增）：作用于全部图片卡片
  # （查信息 / 查在线 / 查性能 / 在线排行榜 / 财富榜）——编码 PNG 前
  # 把整张卡片的像素透明度统一乘以该系数；
  # 默认 1.0 = 完全不透明（与旧版一致）；0.5 = 半透明，
  # 越小越透明（QQ 客户端会按透明度叠加在聊天背景上显示）；
  # 取值范围 0.0 ~ 1.0，超出自动按边界处理；
  # 改动后 /kerong reload 立即生效，无需重启
  global-opacity: 1.0
  # 图片渲染命令的用户冷却秒数（1.6.0 新增，旧版硬编码 5 秒）：
  # 同一 QQ 用户两次发送 /查信息、/查在线、/在线排行榜、/财富榜 的最小间隔，
  # 防止刷屏导致渲染风暴；默认 5；0 = 关闭冷却
  command-cooldown-seconds: 5
  # 查信息卡片是否使用内置背景图（1.5.7 新增，默认 true）
  # true = 内置深灰底图（随 JAR 自带，零配置即用）；
  # false = 随机取数据目录 img/ 文件夹图片（多张轮换）；
  # img 里没有图片时自动回退内置背景图
  info-card-builtin-background: true
  # 查在线图片是否使用内置背景图（1.5.7 新增，默认 true）
  # 语义同上，与查信息卡片共用横版内置底图
  online-list-builtin-background: true
  # 查性能卡片（1.6.7 新增 /查性能 命令；1.6.7.6 起指标固定六项：
  # TPS / MSPT / 内存 / CPU / 延迟 / 在线人数）
  # TPS = 每秒刻数（满值 20）；MSPT = 每刻耗时毫秒（越低越流畅）；
  # 延迟 = 全部在线玩家的平均网络延迟（毫秒，仅无人在线时显示「--」）；
  # 在线人数 = 当前在线玩家数量（仅人数，名单用 /查在线 命令）；
  # 各项自动兼容 Paper / Purpur / Folia / Spigot / NeoForge 核心——
  # 1.6.7.6 起多线程核心（Folia）改用插件内置采样器读取窗口均值，
  # 数值稳定不再忽高忽低；检测到 Spark（插件 / 模组）时优先调用
  # Spark 取数，没装或读不到时回退自研采集，个别核心实在读不到时
  # 显示「--」
  performance:
    # 查性能卡片是否使用内置背景图（语义同上，默认 true）
    builtin-background: true
    # 性能数据缓存秒数（1.6.7.2 新增，覆盖版默认 5 → 60）：缓存时间内的重复
    # /查性能 查询直接复用上一张卡片（多人同时查 / 冷却结束立刻再查
    # 时秒回，不重复取数渲染——对应 EasyBot 模板「渲染过慢」一节
    # 推荐开启的性能数据缓存）；0 = 关闭（每次实时渲染）；
    # 改动后 /kerong reload 立即生效
    cache-seconds: 60

# ---------------- 卡片背景图（无需配置，仅说明） ----------------
# 查信息卡片、查在线图片、在线排行榜、金币排行榜默认全部使用内置背景图
# （深灰色主体 + 深绿色装饰，随插件 / 模组 JAR 自带，零配置即用）。
# 想改用自己的图片：把图片（jpg/png，建议横图）放进
# plugins/KERONGPenguin/img/ 文件夹（模组版为 kerongpenguin/img/），
# 然后把对应功能的开关改为 false：
#   - 查信息：render.info-card-builtin-background
#   - 查在线：render.online-list-builtin-background
#   - 在线排行榜：leaderboard.builtin-background
#   - 金币排行榜：coins-leaderboard.builtin-background
# 多张图时每次渲染随机挑选一张轮换展示；任意尺寸均可
# （自动裁剪/缩放铺满；超大图自动降采样解码，手机原图直放不怕内存溢出）；
# img 文件夹里没有图片时自动回退使用内置背景图

# ---------------- 在线排行榜 ----------------
# 群内发送 /在线排行榜 渲染总在线时长排行图片，
# 每名玩家一行：排名徽章 + 皮肤头像 + 玩家名 + 总在线时长；
# 命令开关见 commands.在线排行榜
leaderboard:
  # 排行榜显示玩家数（默认前 15 名，单张图片最多 15 人；
  # 范围 1-100，超出自动按边界值处理；设更大值会分段发送多张图片）
  top: 15
  # 是否使用内置背景图（1.5.7 改名自 random-background，默认 true）：
  # false 时排行榜背景改为随机取数据目录 img 文件夹里的图片
  # （支持 png/jpg/jpeg/bmp/gif，与查信息、查在线卡片共用素材与缓存）；
  # img 里没有图片时自动回退内置背景图
  builtin-background: true

# 群内发送 /财富榜 渲染金币持有量排行图片（排名徽章 + 皮肤头像 + 玩家名 +
# 金币数量），数据来自 Vault 经济插件余额（全部玩家，含离线）；
# 1.6.2 起 /金币榜 更名为 /财富榜（快捷菜单按钮同步更名，旧命令 /金币榜
# 仍可使用——作为隐藏别名不占菜单位；升级时 commands.金币榜 的开关取值
# 自动迁移到 commands.财富榜）；消息模板文件名仍为 coins-leaderboard-*.md。
# 未安装 Vault 时命令回复"未安装经济插件"提示。
# 图片标题与单位使用下方 economy-alias 配置的经济名称。
# 命令开关见 commands.财富榜
coins-leaderboard:
  # 显示玩家数（默认前 15 名；范围 1-100；超出 15 人自动分段发送多张图片）
  top: 15
  # 是否使用内置背景图（默认 true，与在线排行榜共用竖版内置底图）：
  # false 时改为随机取数据目录 img 文件夹里的图片；
  # img 里没有图片时自动回退内置背景图
  builtin-background: true

# 金币的显示别名：留空 "" = 默认显示"金币"两个字；
# 填写后（如 "元宝"、"硬币"）机器人所有输出里的"金币"字样都会替换为该名称——
# 金币排行榜图片标题、查信息卡片的金币项、签到成功文案、/帮助、全部消息模板等。
economy-alias: ""

# ---------------- QQ 绑定 ----------------
qq-bind:
  # QQ 绑定总开关：开启后玩家进服必须先绑定 QQ
  # （未绑定的玩家会被拦下并展示专属绑定码，1.6.4 起分两段拦截：
  #   老玩家（服务器已有其档案）在进入游戏之前直接拦截，绑定提示直接
  #   显示在"无法连接到服务器"界面；新玩家先放行完成建档（服务器创建
  #   UUID 与玩家数据）再踢出展示绑定码——新玩家必须先建档；
  #   在群里发送 /绑定 <绑定码> 完成，或直接发送纯数字的绑定码自动绑定——
  #   1.6.0 新增：群里发出一串纯数字（4-12 位、不带任何其他文字）时，
  #   若恰好是某位玩家当前的绑定码，发送者即完成绑定，无需输入 /绑定 前缀）
  enabled: false
  # /查信息 统计卡片命令开关（1.5.2 前该命令叫 /个人信息）
  # 关闭后群里无法查询统计卡片，快捷菜单按钮同步隐藏；
  # qq-bind.enabled 总开关关闭时本命令一并失效
  personal-info: true
  # 未绑定玩家进入服务器时看到的拦截界面文案（支持 & 颜色代码，可增删行）
  # 可用变量：{code} = 专属绑定码，{name} = 玩家名，{expire} = 绑定码有效期（分钟）
  kick-message:
    - "&c===== QQ 绑定验证 ====="
    - "&f你还未绑定 QQ，无法进入服务器。"
    - ""
    - "&e你的专属绑定码: &a&l{code}"
    - "&7请在 QQ 群发送: &f/绑定 {code}"
    - "&7（或直接发送纯数字绑定码，机器人自动识别完成绑定）"
    - "&7（绑定码 {expire} 分钟内有效）"
  # 绑定码有效期（分钟）：玩家进服弹出的绑定码超过该时间未使用即作废
  #（至少 1 分钟，填小于 1 的值按 10 处理）
  code-expire-minutes: 10
  # 绑定码位数（范围 4-8，超出范围自动按 4 或 8 处理）
  code-length: 5
  # 群内签到功能（金币经 Vault 经济插件发放；未安装经济插件时签到
  # 照常累计天数、不发放金币，装好后自动恢复发放，无需改配置）
  checkin:
    # 是否开启每日签到（群内发送 /签到 领取金币）
    enabled: false
    # 签到成功回复的前缀文案
    prefix: "[签到]"
    # 每日签到奖励的金币数量（通过 Vault 存入玩家账户）
    reward: 100.0

# 机器人每条文本回复对应的 Markdown 模板文件（位于
# plugins/KERONGPenguin/Markdown/ 目录，首次启动自动释放默认模板）。
# 想改某条回复的文案：改对应的 .md 文件内容即可（支持 Markdown 格式，
# 删掉文件重启可恢复默认）；想换用别的文件名：改下面对应项的值。
# 模板中的占位符（如 {player}）由机器人自动替换为实际值；
# 渲染输出统一应用 economy-alias（"金币"字样自动替换为经济别名）。
#
# —— 占位符（变量）说明：模板里写 {变量名}，发送时自动替换为实际值；
#    未提供的变量原样保留，按“无值时为空”设计的变量整行不显示 ——
#   {player}          玩家名（签到 / 解绑踢出 / OpenId 反查对应的游戏玩家名）
#   {prefix}          签到回复前缀（qq-bind.checkin.prefix 配置的文案）
#   {reward}          本次签到获得的金币数量（已格式化，如 100）
#   {streak}          连续签到天数（中断后从 1 重新累计）
#   {name}            被操作成员的群昵称（黑名单 / 被查询的成员）
#   {count}           黑名单人数
#   {list}            黑名单名单文本（编号列表，每行一人）
#   {error}           错误信息（异常的具体消息文本）
#   {state}           全量转发切换后的状态（“开启”或“关闭”）
#   {openid}          QQ 用户 OpenId（机器人在群里识别成员的编号）
#   {openidPart}      OpenId 反查的管理员行（管理员查询时为 OpenId: xxx 加换行，非管理员为空、该行不显示）
#   {group}           QQ 群 OpenId（填 bot.groups 用的那个编号）
#   {nickname}        OpenId 对应的群昵称（无记录时为提示文案）
#   {lastSeenPart}    最后活跃信息（有记录时为“\n最后活跃: 时间”，无记录为空、整行不显示）
#   {version}         插件当前版本号（help 模板）/ 目标服务器版本（motd-status 模板）
#   {leaderboardLine} 帮助里的在线排行榜条目行（commands.在线排行榜 关闭时为空、该行不显示）
#   {ip} / {port}     服务器地址与端口（motd.server-ip / server-port 配置）
#   {status}          AI 对话上下文当前状态（“开启”或“关闭”）
#   {host}            MOTD 查询的目标服务器地址
#   {type}            目标服务器类型（如 VANILLA）
#   {motd}            目标服务器 MOTD 文本
#   {protocolLine}    协议版本行（有值时为“协议: N\n”，无值为空、该行不显示）
#   {online} / {max}  目标服务器当前在线人数 / 最大人数
#   {delay}           MOTD 查询延迟（毫秒）
#   {playersSection}  在线玩家名单段（有人时为“\n在线玩家:\n- 名单”，空服为空、整段不显示）
messages:
  # —— 通用（多条命令共用） ——
  command-disabled: "command-disabled.md"            # 发送已被关闭的命令时的提示
  no-admin-permission: "no-admin-permission.md"      # 无管理员权限使用管理命令时的提示
  query-too-frequent: "query-too-frequent.md"        # 查询冷却内的"查询太频繁"提示
  server-busy: "server-busy.md"                      # 渲染队列繁忙的兜底提示
  image-send-failed: "image-send-failed.md"          # 图片发送失败（查信息/查在线/排行榜/财富榜）
  manager-not-ready: "manager-not-ready.md"          # 数据管理器未就绪（简短版）
  manager-not-ready-bind: "manager-not-ready-bind.md"      # 绑定管理器未就绪（简短版）
  manager-not-ready-retry: "manager-not-ready-retry.md"    # 管理器未就绪请稍后再试
  manager-not-ready-bind-retry: "manager-not-ready-bind-retry.md" # 绑定管理器未就绪请稍后再试
  qq-unknown: "qq-unknown.md"                        # 无法识别发送者 QQ 账号
  server-status: "server-status.md"                  # /在线服务器 与 /motd 的服务器地址文本（{ip} {port}）
  # —— QQ 绑定 ——
  bind-usage: "bind-usage.md"                        # /绑定 不带参数的用法提示
  bind-usage-fallback: "bind-usage-fallback.md"      # /绑定 用法（管理器异常时的简短回退）
  bind-disabled: "bind-disabled.md"                  # /绑定 但 QQ 绑定功能未开启
  bind-error: "bind-error.md"                        # 绑定处理异常（{error}）
  bind-success: "bind-success.md"                    # 绑定成功（/绑定 与纯数字自动绑定共用）
  bind-invalid: "bind-invalid.md"                    # 绑定码无效或已过期
  # —— 签到 ——
  checkin-disabled: "checkin-disabled.md"            # 签到功能未开启
  checkin-not-bound: "checkin-not-bound.md"          # 签到但 QQ 未绑定玩家（{prefix}）
  checkin-data-error: "checkin-data-error.md"        # 签到数据异常（{prefix}）
  checkin-time-error: "checkin-time-error.md"        # 获取北京时间失败（{prefix}）
  checkin-already: "checkin-already.md"              # 今日已签到（{prefix}）
  checkin-success-no-economy: "checkin-success-no-economy.md"  # 签到成功（无经济插件；{prefix} {player} {streak}）
  checkin-reward-invalid: "checkin-reward-invalid.md" # 奖励数量配置错误（{prefix}）
  checkin-success: "checkin-success.md"              # 签到成功获得金币（{prefix} {player} {reward} {streak}）
  checkin-pay-error: "checkin-pay-error.md"          # 金币系统未就绪（{prefix}）
  # —— 查信息 ——
  info-bind-disabled: "info-bind-disabled.md"       # 查信息未开启（QQ 绑定未启用）
  info-closed: "info-closed.md"                      # 查信息被管理员关闭（personal-info）
  info-not-bound: "info-not-bound.md"                # 查自己但未绑定
  info-target-not-bound: "info-target-not-bound.md"  # /查信息 @某人 但对方未绑定（{name}）
  info-render-failed: "info-render-failed.md"        # 信息卡片生成失败
  # —— 查在线 ——
  online-data-unavailable: "online-data-unavailable.md"  # 服务器数据暂不可用
  online-render-failed: "online-render-failed.md"   # 在线列表图片生成失败
  # —— 在线排行榜 ——
  leaderboard-no-data: "leaderboard-no-data.md"     # 暂无在线时长数据
  leaderboard-render-failed: "leaderboard-render-failed.md"  # 排行榜图片生成失败
  # —— 金币排行榜（1.6.0） ——
  coins-leaderboard-no-economy: "coins-leaderboard-no-economy.md"  # /财富榜 未安装 Vault 经济插件（模板名沿用 coins-，1.6.2 命令更名不影响）
  coins-leaderboard-no-data: "coins-leaderboard-no-data.md"        # 暂无金币数据
  coins-leaderboard-render-failed: "coins-leaderboard-render-failed.md" # 金币排行图片生成失败
  # —— 查询 OpenID ——
  openid-self: "openid-self.md"                     # 自己的 OpenId 与群 OpenId（{openid} {group}）
  openid-lookup: "openid-lookup.md"                 # OpenId 反查结果（{openidPart} {nickname} {lastSeenPart} {player}；管理员才显示 OpenId 行）
  # —— 发信息 ——
  forward-disabled: "forward-disabled.md"           # 聊天转发功能已关闭时 /发信息 的提示
  # —— AI 对话 ——
  ai-context-usage: "ai-context-usage.md"           # /AI对话上下文 用法与当前状态（{status}）
  ai-context-on: "ai-context-on.md"                 # AI 上下文已开启
  ai-context-off: "ai-context-off.md"               # AI 上下文已关闭
  ai-context-cleared: "ai-context-cleared.md"       # AI 上下文已清除
  ai-chat-empty: "ai-chat-empty.md"                 # @机器人 但没输入内容
  ai-chat-error: "ai-chat-error.md"                 # AI 对话失败（{error}）
  # —— 黑名单 ——
  blacklist-empty: "blacklist-empty.md"             # /黑名单 列表为空
  blacklist-list: "blacklist-list.md"               # /黑名单 列表内容（{count} {list}）
  blacklist-added-kicked: "blacklist-added-kicked.md"  # 加入黑名单并踢出了玩家（{name} {player}）
  blacklist-added: "blacklist-added.md"             # 加入黑名单（对方未绑定玩家；{name}）
  blacklist-removed: "blacklist-removed.md"         # 移出黑名单（{name}）
  unblacklist-empty: "unblacklist-empty.md"         # /解除黑名单 列表为空
  unblacklist-list: "unblacklist-list.md"           # /解除黑名单 列表内容（{count} {list}）
  # —— 重新绑定 ——
  rebind-success: "rebind-success.md"               # 解绑成功并踢出（{player}）
  rebind-not-bound: "rebind-not-bound.md"           # QQ 未绑定任何账号
  # —— 帮助 ——
  help: "help.md"                                   # /帮助 全量命令手册（{version} {leaderboardLine}）
  # —— 命令执行 ——
  invalid-params: "invalid-params.md"               # /执行命令、/执行 等参数为空
  bridge-error: "bridge-error.md"                   # 游戏桥接未配置或执行失败
  sent-request: "sent-request.md"                   # 命令已发送执行请求
  execute-failed: "execute-failed.md"               # 命令执行异常（{error}）
  full-amount-toggled: "full-amount-toggled.md"     # /全量 切换结果（{state} = 开启/关闭）
  # —— MOTD 查询（/motd <地址>） ——
  motd-usage: "motd-usage.md"                       # 用法提示
  motd-query-failed: "motd-query-failed.md"         # 查询失败（地址错误/网络）
  motd-offline: "motd-offline.md"                   # 目标服务器离线（{host} {error}）
  motd-error: "motd-error.md"                       # 查询异常（{error}）
  motd-status: "motd-status.md"                     # 在线状态报告（{type} {motd} {version}
                                                     #   {protocolLine} {online} {max} {delay}
                                                     #   {playersSection}，后两个为条件行）

# ---------------- 消息过滤 ----------------
# 正则表达式过滤列表：机器人收发的消息里命中这些正则的部分会被直接删除，
# 剩余内容照常转发（QQ 群 → 游戏、游戏 → QQ 群双向生效，
# 机器人发出的命令回复同样过滤）
# 注意：填写时每一项都必须加双引号
# 示例：filter-regex: ["(?i)广告", "某敏感词"]
filter-regex: []

# ---------------- 管理员判定 ----------------
# 谁可以在 QQ 群使用管理员命令（/执行命令、/黑名单 等）：
#   qq    = 仅群主与 QQ 群管理员（推荐，无需配置）
#   config = 仅下方 openids 名单里的人
#   both  = 满足任一条件即可
admin:
  mode: qq
  # 管理员名单（mode 为 config 或 both 时生效）
  # 填 QQ 的 OpenId（不是 QQ 号！发送 /查询open ID 可获取自己的 OpenId）
  # 注意：填写时每一项都必须加双引号，如 ["OpenId1", "OpenId2"]
  openids: []

# ---------------- 功能开关 ----------------
features:
  # 全量聊天转发：开启后 QQ 群的所有消息（不止命令）都会转发进游戏
  # 也可由管理员在群内发送 /全量 随时切换（按群独立记忆，重启不丢）
  full-amount: false

# ---------------- QQ 群命令开关 ----------------
# 关闭某条命令后，群里发送该命令不再响应，快捷菜单按钮与 /帮助 里的条目同步消失
commands:
  帮助: true            # /帮助 —— 查看所有命令
  查询open ID: true     # /查询open ID —— 查询你的 OpenId 与群 OpenId（配置 bot.groups 用，1.5.2 前为 /查信息）
  查信息: true          # /查信息 —— 查询玩家统计卡片（可直接查自己；@某人 查被提及成员，1.5.2 前为 /个人信息）
  绑定: true            # /绑定 <绑定码> —— 绑定 QQ（玩家自助；纯数字绑定码直接发送亦可自动绑定）
  重新绑定: true        # /重新绑定 —— 解除当前 QQ 绑定并踢出对应玩家（换号重绑用）
  查在线: true          # /查在线 —— 查询在线玩家列表（1.5.7.4 起可用别名 /在线，共用本开关，不出现在快捷菜单；1.6.7 起默认渲染图片输出）
  查性能: true          # /查性能 —— 服务器性能监控卡片（TPS/MSPT/内存/CPU/在线；1.6.7 新增；关闭后快捷菜单按钮同步消失）
  在线排行榜: true      # /在线排行榜 —— 总在线时长排行（关闭后快捷菜单按钮同步消失，1.5.5 新增）
  财富榜: true          # /财富榜 —— 金币持有量排行（需 Vault；关闭后快捷菜单按钮同步消失；1.6.0 新增为 /金币榜，1.6.2 更名，旧命令仍可用）
  在线服务器: true      # /在线服务器 —— 查看服务器 IP 与端口
  发信息: true          # /发信息 <内容> —— 发送消息到游戏内
  执行命令: true        # /执行命令 <命令> —— 管理员执行服务器命令
  执行: true            # /执行 <key> —— 执行自定义命令（所有人可用项）
  管理员执行: true      # /管理员执行 <key> —— 管理员执行自定义命令（管理员限定项）
  全量: true            # /全量 —— 切换全量聊天转发（管理员）
  motd: true            # /motd —— 查询服务器状态
  AI对话上下文: true    # /AI对话上下文 开|关 —— 切换 AI 对话记忆（管理员）
  清除当前上下文: true  # /清除当前上下文 —— 清空 AI 对话历史（管理员）
  黑名单: true          # /黑名单 @QQ —— 加入黑名单（自动解绑并踢出，管理员）
  解除黑名单: true      # /解除黑名单 @QQ —— 移出黑名单（管理员）
  签到: true            # /签到 —— 每日签到领金币

# ---------------- AI 对话 ----------------
# QQ 群内 @机器人 或游戏内输入前缀即可与 AI 对话（OpenAI / DeepSeek 等兼容接口）
ai:
  # AI 对话总开关：关闭后 QQ 群（@机器人）和游戏内的 AI 对话都不可用
  enabled: false
  # 游戏内 AI 对话开关（玩家输入前缀触发，默认关闭；
  # 需要 ai.enabled 总开关同时开启才生效）
  server-enabled: false
  # 游戏内呼出 AI 的前缀：玩家输入 "ai 你好" 即触发对话
  server-prefix: "ai"
  # AI 回复在游戏内显示时的前缀
  server-output-prefix: "[AI]"
  # AI 回复在 QQ 群内显示时的前缀
  qq-output-prefix: "[AI]"
  # AI 接口地址（OpenAI 兼容接口均可）：
  #   DeepSeek 官方：https://api.deepseek.com （不用加 /v1）
  #   OpenAI 官方：https://api.openai.com/v1
  #   其他中转/自建接口按服务商文档填写
  base-url: "https://api.deepseek.com"
  # AI 平台的 API Key（在服务商后台生成，注意保密）
  api-key: ""
  # 模型名称（DeepSeek 填 deepseek-chat；OpenAI 填 gpt-4o-mini 等）
  model: "deepseek-chat"
  # AI 的角色设定（系统提示词）：决定 AI 回复的风格与身份
  system-prompt: "你是一个友好的游戏群助手，请简洁回答。"
  # 是否自动补充接口地址后缀（部分接口需要在地址后补 /v1 才能用，保持默认即可）
  url-auto-append: true
  # AI 对话上下文保留轮数：开启 /AI对话上下文 后 AI 会记住最近几轮对话
  # （全局一份记忆：所有群、所有人与游戏内共用；0 = 不保留上下文）
  context-limit: 6

# ---------------- 自定义执行指令 ----------------
# 在 QQ 群通过 /执行 <key> 或 /管理员执行 <key> 触发预设的服务器命令
# 每条包含三个字段：
#   key        触发名称（群里发送 /执行 <key>）
#   command    实际执行的服务器命令，{params} = 触发后空一格输入的内容
#              （如 "/执行 公告 明天维护" 中 {params} = "明天维护"）
#   permission 权限：0 或不填 = 所有人可用（群里 /执行 触发）；
#              其他值（如 1）= 仅管理员可用（群里 /管理员执行 触发）
custom-commands: []
# 示例（去掉每行开头的 # 即生效）：
# - key: "公告"
#   command: "say {params}"
#   permission: 1
