  player-lookup: "player-lookup.md"                 # 玩家名反查结果（{player} {openidPart} {nickname} {players}）
  cluster-single: "cluster-single.md"               # /切换服务器 单服提示（{server}）
  cluster-list-fallback: "cluster-list-fallback.md" # /切换服务器 按钮不可用时的纯文本列表（{list}）
