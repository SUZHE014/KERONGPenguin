  execute-failed: "execute-failed.md"               # 命令执行异常（{error}）
  full-amount-toggled: "full-amount-toggled.md"     # /全量 切换结果（{state}）

# ---------------- 消息过滤 ----------------
# 正则过滤：机器人收发的消息里命中这些正则的部分直接删除，
# 剩余内容照常转发（双向生效，命令回复同样过滤）
# 每一项都要加双引号，如 ["(?i)广告", "某敏感词"]
filter-regex: []

# ---------------- 管理员判定 ----------------
# 谁可以在 QQ 群使用管理员命令（/执行命令、/黑名单 等）：
#   qq = 群主与群管理员（推荐，无需配置）
#   config = 仅下方 openids 名单里的人
#   both = 满足任一即可
# 按钮口径：qq/both 下管理类按钮带平台门禁（仅群主/群管理员可点，
# 撤权立即点不动）；config 名单模式下管理类按钮改为点击填入输入栏，
# 手动发送后按名单判定（名单增删立即生效）。
admin:
  mode: qq
  # 管理员名单（填 OpenId，群里发 /查信息 获取；每项加双引号）
  openids: []
  # 快捷面板管理员联动（默认开）：mode 为 qq/both 时，自动把 QQ
  # 快捷面板里管理类指令（执行命令/管理员执行/全量/AI管理/黑名单/解除黑名单）
  # 设为仅群主/群管理员可见可点（QQ 端实时校验，与 /菜单 管理按钮同一口径）；
  # mode 为 config 时本联动不生效（面板全员可见，命令按下方名单判定）。
  # 改动后 /hbkrg reload 随面板重同步立即生效。
  panel-admin-linkage: true

# ---------------- 功能开关 ----------------
features:
  # 全量聊天转发：开启后 QQ 群的所有消息（不止命令）都转进游戏
  #（总开关，对下方 bot.groups 里全部群统一生效；管理员在群里发
  # /全量 可随时切换，改完写回本文件；关闭时菜单与快捷面板的全量按钮同步隐藏）
  full-amount: false

# ---------------- QQ 群命令开关 ----------------
# 关闭某条命令后群里不再响应，快捷菜单按钮与 /菜单 按钮同步消失；
# 改动后 /hbkrg reload 立即生效
commands:
  菜单: true            # /菜单 —— 指令按钮菜单（短按钮一行两个，长按钮独占一行置顶；无参命令点击即执行，带参命令点击复制进输入栏；分页展示）
  查信息: true          # /查信息 —— 查 OpenId（加玩家名可反查其绑定的 QQ）
  玩家名片: true        # /玩家名片 —— 玩家统计卡片（@某人 查别人）
  绑定: true            # /绑定 <绑定码> —— 绑定 QQ（纯数字码直接发送亦可）
  重新绑定: true        # /重新绑定 —— 解绑换号
  查在线: true          # /查在线 —— 在线玩家列表（别名 /在线）
  查性能: true          # /查性能 —— 性能卡片（TPS/MSPT/内存/CPU/在线人数）
  在线排行榜: true      # /在线排行榜 —— 总在线时长排行
  财富榜: true          # /财富榜 —— 金币排行（需 Vault）
  发信息: true          # /发信息 <内容> —— 发消息到游戏内
  执行命令: true        # /执行命令 <命令> —— 管理员执行服务器命令
  执行: true            # /执行 <key> —— 执行自定义命令
  管理员执行: true      # /管理员执行 <key> —— 执行管理员限定命令
  全量: true            # /全量 —— 切换全量转发总开关（管理员；对全部配置群生效并写回配置文件）
  AI管理: true          # /AI管理 开|关|清除 —— AI 上下文管理（管理员；点击按钮即可操作；AI 关闭时不可用）
  黑名单: true          # /黑名单 @QQ —— 拉黑（自动解绑并踢出，管理员）；不带 @ 列出清单并附「解除」按钮
  解除黑名单: true      # /解除黑名单 @QQ —— 解除拉黑（管理员）；不带 @ 列出清单，可点击按钮逐条解除
  签到: true            # /签到 —— 每日签到领奖励
  切换服务器: true      # /切换服务器 [服务器名] —— 多服务器集群：查看并切换当前群操作的服务器（带名直接切换；「全局」需管理员；未配置集群时提示单服）

# ---------------- AI 对话 ----------------
# QQ 群里 @机器人 或游戏内输入前缀即可对话（OpenAI / DeepSeek 等兼容接口）
ai:
  # AI 对话总开关（关闭后群内与游戏内的 AI 对话都不可用）
  enabled: false
  # 游戏内 AI 开关（玩家输入前缀触发；需总开关同时开启）
  server-enabled: false
  # 游戏内呼出前缀（玩家输入 "ai 你好" 即触发）
  server-prefix: "ai"
  # AI 回复显示前缀（游戏内 / 群内）
  server-output-prefix: "[AI]"
  qq-output-prefix: "[AI]"
  # 接口地址（DeepSeek：https://api.deepseek.com；OpenAI 记得加 /v1）
  base-url: "https://api.deepseek.com"
  # API Key（服务商后台生成，注意保密）
  api-key: ""
  # 模型名称（DeepSeek 填 deepseek-chat；OpenAI 填 gpt-4o-mini 等）
  model: "deepseek-chat"
  # AI 的角色设定（决定回复风格与身份）
  system-prompt: "你是一个友好的游戏群助手，请简洁回答。"
  # 自动补接口地址后缀（部分接口需要补 /v1，保持默认即可）
  url-auto-append: true
  # 记住最近几轮对话（全局一份记忆，所有群与游戏内共用；0 = 不记）
  context-limit: 6
  # AI 艾特接口（默认开）：群里 @机器人 的消息中，其他成员的艾特不再剥掉，
  # 而是还原为「@昵称」送给 AI（如「你好，@张三，这人是谁？」AI 能看到
  # 被艾特的是谁）；同时 AI 可在回复中输出 [at:群昵称] 标记艾特对应成员，
  # 发送前自动转为 QQ 官方艾特（昵称未知时降级纯文本不丢字）。关闭时恢复
  # 旧行为（艾特剥掉，AI 亦不知晓艾特接口）
  at-enabled: true
  # QQ 群 AI 回复提醒方式（三选一——决定每次 AI 回复怎么提醒发送人）：
  #   at    = 每次回复开头艾特发送人（手机 QQ 会收到提醒）
  #   quote = 每次回复引用发送者的原消息（QQ 引用框）
  #   none  = 既不艾特也不引用（安静回复）
  # 中文取值也可以（艾特 / 引用 / 无，大小写均可）；
  # 留空 "" = 默认引用；改完 /hbkrg reload 即时生效
  reminder-mode: ""

# ---------------- 自定义指令 ----------------
# 群里发 /执行 <key> 触发预设的服务器命令，每条三个字段：
#   key        触发名称
#   command    实际执行的命令（{params} = 命令后面跟的内容）
#   permission 0 或不填 = 所有人可用；其他值 = 仅管理员
custom-commands: []
# 示例（去掉每行开头的 # 即生效）：
# - key: "公告"
#   command: "say {params}"
#   permission: 1
